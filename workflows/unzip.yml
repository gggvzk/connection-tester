name: Unzip and Commit

on:
  push:
    paths:
      - "connection_tester.zip"

jobs:
  unzip:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: ZIPを解凍
        run: |
          mkdir -p extracted
          unzip -o connection_tester.zip -d extracted

      - name: 変更を確認
        run: git status

      - name: Gitにコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add extracted
          git diff --cached --quiet || git commit -m "Auto extract ZIP"

      - name: GitHubにPush
        run: git push
