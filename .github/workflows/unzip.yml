name: Extract connection_tester.zip

on:
  push:
    paths:
      - "connection_tester.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          rm -rf connection_tester
          mkdir -p connection_tester
          unzip -o connection_tester.zip -d connection_tester

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add connection_tester

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto extract connection_tester.zip"
            git push
          fi
